# Homeowner-assembled steel kit: preliminary section study, not build files.
# Independent of legacy H0/P0, which retain donor axle envelopes for comparison.
[study]
frame_length_mm = 2190
support_span_mm = 1600
rail_count = 2
gross_vehicle_mass_kg = 450       # proposed load envelope including operator, deck and chassis
vertical_load_factor = 3.0
yield_safety_factor = 2.0
screening_yield_mpa = 250         # assumed comparison value; verify the purchased steel grade
deflection_span_ratio = 400
max_part_length_mm = 1000         # preferred kit part limit, below the shop's absolute limit
splice_allowance_kg_per_joint = 0.6 # estimate only; plates and fasteners need detail design

[search]
thickness_in = [0.074, 0.119]
web_depth_mm = [80, 100, 120, 140, 160, 180]
rail_width_mm = [30, 40, 50, 60]
return_lip_mm = [20, 25, 30]

# Shape: vertical C web, horizontal top/bottom flanges, outward return lips.
# A separate flat side cover bolts to those lips with access outside the box.
# All dimensions are centreline idealizations; no flat patterns are released.
