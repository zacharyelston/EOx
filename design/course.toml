# EOX standard test course (shared): a 3D terrain every model drives in a
# MuJoCo rigid-body simulation (`uv run eox course --model home|pro`).
#
# The course is a heightfield laid out along +x, centreline y = 0. Obstacles
# follow each other with flat gaps between. Each is scored per model and
# configuration (bare, deck fitted): see [course.scoring] and src/eox/sim/.
# Sizes are mower-practice and EOX-rating values, not from a standard yet:
# REF until checked against B71.1 / ISO 5395 test procedures.

[course]
name = "EOX standard test course"
width = 8.0                    # m, across the course
resolution = 0.05              # m, heightfield cell
run_in = 5.0                   # m of flat before the first obstacle
run_out = 6.0                  # m of flat after the last
gap = 4.0                      # m of flat between obstacles
speed_kmh = 3.0                # target ground speed (slope-mowing pace)
start_x = 1.5                  # m, where the vehicle's rear axle starts

[course.sim]
timestep = 0.002               # s
control_hz = 50
settle_s = 3.0                 # let the machine settle on its tyres before driving
stuck_s = 5.0                  # no forward progress for this long = stuck
time_limit_factor = 3.0        # time limit = factor x course length / target speed
rolled_deg = 50                # roll or pitch past this = rolled over
friction_torsional = 0.02      # m: tyre spin-in-place friction (REF)
drive_gain = 50                # N*m per rad/s at each wheel: the drive units' speed loop. Stiffer
                               # loops chatter against the tyre contact and spin the wheels

[course.scoring]
wheel_lift_n = 50              # a wheel carrying less than this is off the ground ...
wheel_lift_s = 0.3             # ... for at least this long: wheel lift (WARN)
lateral_limit = 1.5            # m off the centreline = left the course (FAIL)
peak_torque_s = 3.0            # motor at its peak-torque limit for longer than this (WARN)
deck_float = 75                # mm the deck's floating hitch and anti-scalp rollers take up (REF); more = scalps

# Obstacles, in course order. kind:
#   bump        half-cosine hump across the course
#   step        a kerb: step up, plateau, step down
#   ditch       cosine swale across the course
#   twist       alternating humps under the left and right wheel tracks
#   ramp        climb at slope_deg to `rise`, plateau, descend (rounded crests)
#   side_slope  the ground tilts across the course to slope_deg, then back
# A ramp steeper than the model's rated climb (vehicle.max_slope_deg) is
# scored as information only: the machine is not rated for it.

[[course.obstacle]]
name = "bump"
kind = "bump"
height = 0.075                 # a root or a speed bump
length = 0.6

[[course.obstacle]]
name = "kerb"
kind = "step"
height = 0.075                 # a paving edge
length = 3.0                   # plateau

[[course.obstacle]]
name = "ditch"
kind = "ditch"
depth = 0.20                   # a drainage swale
length = 2.0

[[course.obstacle]]
name = "twist"
kind = "twist"
height = 0.15                  # humps under one wheel track at a time
length = 1.2                   # hump diameter
pitch = 2.0                    # hump to hump along the course
count = 3
offset = 0.47                  # m off the centreline: under the wheel tracks

[[course.obstacle]]
name = "climb 12 deg"
kind = "ramp"
slope_deg = 12
rise = 1.0
length = 3.0                   # plateau
crest_radius = 4.0             # m, rounds the sag and crest

[[course.obstacle]]
name = "climb 15 deg"
kind = "ramp"
slope_deg = 15
rise = 1.0
length = 3.0
crest_radius = 4.0

[[course.obstacle]]
name = "side slope 17 deg"
kind = "side_slope"
slope_deg = 17                 # the cross-slope label value (MIOSHA 5443, docs/architecture.md)
length = 8.0                   # at full tilt
transition = 4.0               # m to tilt in, and again to tilt out
