# Packaging / material-budget study, not fabrication or validated vehicle data.
[sheet]
size_in = [56, 34]              # user's first-choice reference sheet
edge_mm = 6
gap_mm = 4                     # design reserve, not supplier acceptance
trials = 250

[[materials]]
id = "mild"
material = "mild_steel"
thickness_in = 0.119           # existing supplier-listed baseline gauge

[[materials]]
id = "304"
material = "ss_304"
thickness_in = 0.125           # user's premium option

[packaging]
battery_mm = [520, 270, 220]    # retains existing 100 Ah / 45 kg reference pack
battery_mass_kg = 45
terminal_clearance_mm = 35
battery_front_axle_offset_mm = -100 # centre behind front axle, above axle cradle
generator_mm = [700, 530, 570]  # union of conflicting official dimensions, rounded up
generator_dry_mass_kg = 40      # larger manual value, rounded up; excludes fuel/mounts
generator_position = "rear removable carrier"

