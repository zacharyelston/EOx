# Surface finishes -> solar absorptivity (alpha) and IR emissivity (eps).
# Typical handbook ranges, rounded; good enough for a screening thermal estimate.
[finish.powder_white]
alpha = 0.25
eps = 0.90
[finish.powder_grey]
alpha = 0.60
eps = 0.90
[finish.powder_black]
alpha = 0.95
eps = 0.90
[finish.bare_aluminum]
alpha = 0.30
eps = 0.10
[finish.bare_stainless]
alpha = 0.45
eps = 0.20
