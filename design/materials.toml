# Sheet materials and SendCutSend (SCS) bend specs.
#
# Bend values are SCS's published numbers at 90 deg. SCS requires uploaded STEP
# models to use THEIR k-factor and inside radius, so do not "improve" these.
# Sources (fetched 2026-10-18):
#   bend table   https://sendcutsend.com/bending-calculator/
#   bend rules   https://sendcutsend.com/services/cnc-bending/
#   features     https://sendcutsend.com/guidelines/bend-deformation/
#   reliefs      https://sendcutsend.com/blog/guide-to-designing-bend-reliefs/
#   datasheets   https://sendcutsend.com/materials/5052-aluminum/ ("View specs")
# Gauge values are in INCHES as published; code converts to mm.

[scs]
bend_flat_max_in = [30.0, 44.0]       # largest flat blank that can be bent
bend_flat_min_in = [0.375, 1.5]
laser_sheet_max_in = [30.0, 44.0]     # instant-quote limit (56x44 by custom quote)
powder_coat_max_in = [30.0, 36.0]
max_bend_angle_deg = 130              # one datasheet says 120 for 304 .125
u_channel_base_to_flange = 2.0        # base >= 2 x flange on U/C channels
corner_gap_min_in = 0.015
cut_tolerance_in = 0.005
bend_tolerance_in = 0.015

[al_5052_h32]
name = "Aluminum 5052-H32"
density = 2680          # kg/m^3
E_mpa = 70300
yield_mpa = 193
uts_mpa = 228
k_w_mk = 138
[[al_5052_h32.gauges]]
