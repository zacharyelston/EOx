# EOX Home: conventional 2WD
#
# A golf-cart front steering axle (design/steer_axle.toml) and ONE drive-axle
# module (design/axle.toml) at the rear. As on a golf cart, the battery &
# distribution box hangs low between the axles under the seat; a mid-mount
# deck fits under it.
#
# Frame: origin on the ground under the rear axle, x forward, y left, z up. mm, kg.

[model]
name = "EOX Home"
layout = "steer_axle"
revision = "H0"
modes = ["mowing", "slope_mowing", "transport"]   # no 3-unit hydraulics on Home

[overrides]                    # shared values Home changes (the box keeps all 4 branches; one is spare)
"bus.max_simultaneous_units" = 2   # drive + PTO
"bus.branch_conductor_length_m" = 3.0
"axle.ratio" = 15.0            # aftermarket 15:1 gear set in the stock rear end (BOM G01): one driven axle
                               # carrying the deck needs it on a 12 deg climb (review P1, issue 2)

[vehicle]
mass_operator_kg = 100
mass_payload_kg = 0
rolling_resistance = 0.10
traction_coefficient = 0.5     # turf
top_speed_kmh = 8.0
design_slope_deg = 10
max_slope_deg = 12             # short climbs with the deck fitted: rear-tyre grip on turf runs out near 14 deg
max_cross_slope_deg = 17       # across a slope: the label value (MIOSHA 5443, docs/architecture.md)
duty_overhead = 1.25

[layout]
wheelbase = 1600               # rear axle (x = 0) to front axle (golf carts: 1,664-1,676)
rear_overhang = 340            # frame behind the rear axle (controller, hitch)
front_overhang = 250           # frame ahead of the front axle
frame_half_width = 310         # rails clear the sideways motor and sit inside the rear tyres
nose_x = 1200                  # from here forward the rails neck in ...
nose_half_width = 100          # ... clear of the steered front wheels' sweep (inner edge ~130 mm at full lock)
rail_mass_kg_per_m = 5.0       # sheet-steel chassis rails + cross members, estimate (22 kg at the H0 layout)
powerbox_x = 510               # box centre: just ahead of the rear axle and its motor, under the seat
powerbox_z = 230               # box underside, slung between the rails; a deck top at min cut is 150
box_stand_mass_kg = 5          # REF: a frame lifting the box clear of the rails, if it sits above them
seat_and_controls_mass_kg = 30
hitch_mass_kg = 3              # rear hitch plate, estimate
operator_cg = [520, 0, 790]    # seated; the seat, floor, wheel and controls are placed from here
seat_height = 538              # seat pan underside: on the box when the box is under it, else on a pedestal
seat_pedestal_mass_kg = 4      # REF: seat bridge (posts on the rails + plate), only when the box isn't under the seat
seat_and_controls_offset = [180, 0, -190]   # their CG, from the operator CG
floor_reach = 560              # floor pan centre, ahead of the operator CG
floor_length = 360
steering_wheel_reach = 540     # wheel centre, ahead of the operator CG ...
steering_wheel_height = 840    # ... at chest height

[steering]
type = "rack and pinion"       # manual, golf-cart parts
scrub_coefficient = 0.6        # standstill steering on turf
steering_wheel_diameter = 330

[deck]                         # mid-mount between the axles (front-mount vs drive-over: issue 7)
mount = "mid (drive-over)"
x_center = 800                 # between the rear tyres and the front tyres' swing, under the box
length = 600
width = 1070                   # 42 in
housing_height = 110
bottom_clearance = 40          # housing underside at the lowest cut
top_height_min_cut = 150       # REF
mass_kg = 45                   # deck shell, spindles, blades, belt (REF); the PTO unit is counted separately
pto_unit_y = 430               # PTO unit stands on the deck, shaft down, outboard of the frame rail

[bom]
powerbox = 1
drive_axle = 1
steer_axle = 1
gear_set = 1
controls = 1
