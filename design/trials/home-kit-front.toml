# New source snapshot / cache required. A layout surrogate, not joint FEA.
# Front battery, roomier B chassis, layer nests/masses regenerated per length.
# Generic rear-drive allowance and complete B0 electrical enclosure retained.
[trial]
name = "home-kit-front"
model = "home-kit"
question = "Which front-battery kit layout improves terrain contact, deck clearance and rear-drive traction while keeping each provisional layer on a 56x34 inch sheet?"
course_configs = ["bare", "deck"]
population = 96
generations = 40
elite = 6
seed = 22

[[trial.gene]]
key = "layout.wheelbase"
min = 1400
max = 1600
step = 25
why = "frame length, sheet fit and sheet masses follow wheelbase plus the fixed 150 mm overhangs"

[[trial.gene]]
key = "kit.powerbox_front_offset"
min = -300
max = -100
step = 10
why = "keep the full electrical enclosure in the front bay relative to the front axle"

[[trial.gene]]
key = "layout.powerbox_z"
min = 410
max = 550
step = 10
why = "front battery height above frame and steering; no under-seat solutions"

[[trial.gene]]
key = "layout.operator_cg.0"
min = 150
max = 400
step = 10
why = "seat position, rear-drive load and steering-column clearance"

[[trial.gene]]
key = "deck.x_center"
min = 560
max = 850
step = 10
why = "mid-mount deck packaging and ground clearance"

[[trial.gene]]
key = "deck.pto_unit_y"
choices = [-480, 480]
why = "motor side; keep clear of the floor envelope"

[[trial.objective]]
metric = "course_warns"
goal = "min"
weight = 5

[[trial.objective]]
metric = "wheel_lift_s"
goal = "min"
weight = 4

[[trial.objective]]
metric = "deck_float_mm"
goal = "min"
weight = 1
scale = 25

[[trial.objective]]
metric = "grip_limit_deg"
goal = "max"
weight = 2

[[trial.objective]]
metric = "working_slope_deg"
goal = "max"

[[trial.objective]]
metric = "mowing_runtime_h"
goal = "max"
weight = 2
scale = 0.1

[[trial.objective]]
metric = "mass_kg"
goal = "min"
scale = 10

[[trial.constraint]]
metric = "calc_fails"
max = 0

[[trial.constraint]]
metric = "course_fails"
max = 0

[[trial.constraint]]
metric = "grip_limit_deg"
min = 12

# Screening floor for this heavier first kit; the product target remains 1.5 h.
# Runtime stays an objective and the normal engineering warning is preserved.
[[trial.constraint]]
metric = "mowing_runtime_h"
min = 1.3

# A static screening metric, not an operating cross-slope rating.
[[trial.constraint]]
metric = "working_slope_deg"
min = 16
