[project]
name = "eox"
version = "0.1.0"
description = "EOX: open-source flat-sheet electric garden tractor — calcs, CAD and BOM"
authors = [
    { name = "Zac Elston", email = "zacharyelston@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "ezdxf>=1.4.5",
]

[project.scripts]
eox = "eox.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
